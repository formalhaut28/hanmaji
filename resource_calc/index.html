<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会心込み攻撃力計算</title>

<style>
body {
  font-family: sans-serif;
  max-width: 720px;
  margin: 16px auto;
  padding: 8px;
}

h1, h2 {
  margin: 12px 0;
}

.row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.block {
  border: 1px solid #ddd;
  padding: 8px;
  min-width: 200px;
}

label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
}

input {
  width: 80px;
  padding: 4px;
  font-size: 14px;
  text-align: right;
}

.result {
  background: #f3f3f3;
  padding: 10px;
  margin-bottom: 16px;
}

.formula {
  font-family: monospace;
  background: #e9e9e9;
  padding: 6px;
  margin-top: 6px;
  word-break: break-all;
}
.small {
  color: #666;
  font-size: 13px;
}
</style>
</head>

<body>

<h1>会心込み攻撃力計算</h1>

<!-- 計算結果（ページ上部） -->
<div class="result">
  <h2>計算結果</h2>
  <div>攻撃力：<strong id="resAtk"></strong></div>
  <div>会心率合計：<strong id="critRateTotal"></strong>%</div>
  <div>会心ダメージ合計：<strong id="critDmgTotal"></strong>%</div>
  <div style="margin-top:6px;">
    会心込み攻撃力：<strong id="finalAtk"></strong>
  </div>

  <h3>計算式</h3>
  <div class="formula">
    攻撃力 × (1 + 会心率 × 会心ダメージ)
  </div>

  <h3>あなたの攻撃力</h3>
  <div class="formula" id="detailFormula"></div>
</div>

<!-- 入力欄 -->
<div class="row">

  <!-- 攻撃力 -->
  <div class="block">
    <h2>攻撃力</h2>
    <label>
      攻撃力
      <input type="number" id="atk" value="5000" min="0" max="999999">
    </label>
  </div>

  <!-- 会心率 -->
  <div class="block">
    <h2>会心率 <span class="small">(基礎10%)</span></h2>
    <label>
      ジェム
      <input type="number" id="critRateGem" value="30" min="0" max="999999">
    </label>
    <label>
      協会技術
      <input type="number" id="critRateGuild" value="0" min="0" max="100" step="0.1">
    </label>
  </div>

  <!-- 会心ダメージ -->
  <div class="block">
    <h2>会心ダメ <span class="small">(基礎25%)</span></h2>
    <label>
      ジェム
      <input type="number" id="critDmgGem" value="150" min="0" max="999999">
    </label>
    <label>
      協会技術
      <input type="number" id="critDmgGuild" value="0" min="0" max="999999">
    </label>
  </div>

</div>

<script>
const inputs = document.querySelectorAll("input");

inputs.forEach(input => {
  input.addEventListener("input", calculate);
  input.addEventListener("focus", e => e.target.select());
});

function calculate() {
  const atk = Number(atkInput.value);

  const critRate =
    10 +
    Number(critRateGem.value) +
    Number(critRateGuild.value);

  const critRateClamped = Math.min(critRate, 100);

  const critDmg =
    25 +
    Number(critDmgGem.value) +
    Number(critDmgGuild.value);

  const critRateDecimal = critRateClamped / 100;
  const critDmgDecimal = critDmg / 100;

  const finalAtkValue =
    atk * (1 + critRateDecimal * critDmgDecimal);

  resAtk.textContent = atk;
  critRateTotal.textContent = critRateClamped.toFixed(1);
  critDmgTotal.textContent = critDmg.toFixed(0);
  finalAtk.textContent = Math.round(finalAtkValue);

  detailFormula.textContent =
    `${atk} × (1 + ${critRateClamped}%(${critRateDecimal.toFixed(3)}) × `
    + `${critDmg}%(${critDmgDecimal.toFixed(3)})) = `
    + Math.round(finalAtkValue);
}

const atkInput = document.getElementById("atk");
const critRateGem = document.getElementById("critRateGem");
const critRateGuild = document.getElementById("critRateGuild");
const critDmgGem = document.getElementById("critDmgGem");
const critDmgGuild = document.getElementById("critDmgGuild");

const resAtk = document.getElementById("resAtk");
const critRateTotal = document.getElementById("critRateTotal");
const critDmgTotal = document.getElementById("critDmgTotal");
const finalAtk = document.getElementById("finalAtk");
const detailFormula = document.getElementById("detailFormula");

calculate();
</script>

</body>
</html>
