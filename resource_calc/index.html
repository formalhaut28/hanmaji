<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ハンターのマジック Lv計算ツール</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 32px;
      background: #f6f7fb;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 24px;
    }
    h2 {
      margin-top: 32px;
      font-size: 1.3rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }
    .row {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="number"] {
      width: 120px;
      padding: 6px;
      font-size: 1rem;
    }
    input[type="range"] {
      width: 100%;
    }
    .range-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .result {
      font-size: 1.1rem;
      font-weight: 600;
      background: #f0f3ff;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>ハンターのマジック<br>レベルアップ必要アイテム自動計算</h1>

  <!-- 装備Lv -->
  <div class="card">
    <h2>1. 装備Lv</h2>

    <div class="row range-pair">
      <div>
        <label>現在の装備Lv</label>
        <input type="number" id="equipMin" value="0" min="0" max="200" />
        <input type="range" id="equipMinRange" min="0" max="200" value="0" />
      </div>
      <div>
        <label>目標の装備Lv</label>
        <input type="number" id="equipMax" value="10" min="0" max="200" />
        <input type="range" id="equipMaxRange" min="0" max="200" value="10" />
      </div>
    </div>

    <div class="result" id="equipResult"></div>
  </div>

  <!-- 見習いLv -->
  <div class="card">
    <h2>2. 見習いLv</h2>

    <div class="row range-pair">
      <div>
        <label>現在の見習いLv</label>
        <input type="number" id="apprenticeMin" value="0" min="0" max="200" />
        <input type="range" id="apprenticeMinRange" min="0" max="200" value="0" />
      </div>
      <div>
        <label>目標の見習いLv</label>
        <input type="number" id="apprenticeMax" value="10" min="0" max="200" />
        <input type="range" id="apprenticeMaxRange" min="0" max="200" value="10" />
      </div>
    </div>

    <div class="result" id="apprenticeResult"></div>
  </div>

  <script>
    function sync(minInput, maxInput, minRange, maxRange, onUpdate) {
      let min = Number(minInput.value);
      let max = Number(maxInput.value);

      if (min > max) [min, max] = [max, min];

      minInput.value = min;
      maxInput.value = max;
      minRange.value = min;
      maxRange.value = max;

      onUpdate(min, max);
    }

    /* -------- 装備Lv -------- */
    const equipMin = document.getElementById('equipMin');
    const equipMax = document.getElementById('equipMax');
    const equipMinRange = document.getElementById('equipMinRange');
    const equipMaxRange = document.getElementById('equipMaxRange');
    const equipResult = document.getElementById('equipResult');

    function calcEquip(min, max) {
      let totalRecipe = 0;
      let totalGold = 0;

      for (let n = min + 1; n <= max; n++) {
        totalRecipe += n;
        totalGold += Math.ceil(100 + 1.5 * n * n);
      }

      const attack = Math.ceil(0.05 * max * (max + 30));

      equipResult.innerHTML = `
        必要レシピ合計：${totalRecipe.toLocaleString()}<br>
        必要ゴールド合計：${totalGold.toLocaleString()}<br>
        目標Lv時 攻撃力：${attack.toLocaleString()}
      `;
    }

    [equipMin, equipMax].forEach(el => el.addEventListener('input', () =>
      sync(equipMin, equipMax, equipMinRange, equipMaxRange, calcEquip)
    ));
    [equipMinRange, equipMaxRange].forEach(el => el.addEventListener('input', () => {
      if (el === equipMinRange) equipMin.value = el.value;
      if (el === equipMaxRange) equipMax.value = el.value;
      sync(equipMin, equipMax, equipMinRange, equipMaxRange, calcEquip);
    }));

    /* -------- 見習いLv -------- */
    const apprenticeMin = document.getElementById('apprenticeMin');
    const apprenticeMax = document.getElementById('apprenticeMax');
    const apprenticeMinRange = document.getElementById('apprenticeMinRange');
    const apprenticeMaxRange = document.getElementById('apprenticeMaxRange');
    const apprenticeResult = document.getElementById('apprenticeResult');

    function calcApprentice(min, max) {
      let totalExp = 0;

      for (let n = min + 1; n <= max; n++) {
        totalExp += 500 + 190 * (n - 1) + (n - 1) * (n - 2);
      }

      apprenticeResult.innerHTML = `
        必要見習いExp合計：${totalExp.toLocaleString()}
      `;
    }

    [apprenticeMin, apprenticeMax].forEach(el => el.addEventListener('input', () =>
      sync(apprenticeMin, apprenticeMax, apprenticeMinRange, apprenticeMaxRange, calcApprentice)
    ));
    [apprenticeMinRange, apprenticeMaxRange].forEach(el => el.addEventListener('input', () => {
      if (el === apprenticeMinRange) apprenticeMin.value = el.value;
      if (el === apprenticeMaxRange) apprenticeMax.value = el.value;
      sync(apprenticeMin, apprenticeMax, apprenticeMinRange, apprenticeMaxRange, calcApprentice);
    }));

    /* 初期計算 */
    sync(equipMin, equipMax, equipMinRange, equipMaxRange, calcEquip);
    sync(apprenticeMin, apprenticeMax, apprenticeMinRange, apprenticeMaxRange, calcApprentice);
  </script>
</body>
</html>
